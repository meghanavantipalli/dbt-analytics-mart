version: 2
sources:
  - name: stash_raw
    database: neondb
    schema: raw
    

    tables:
      - name: users
        description: "Raw customer registration logs"
        
        

      - name: subscriptions
        description: "Raw user subscription tiers and states"
        config:
          loaded_at_field: updated_at
          freshness: 
            warn_after: 
              count: 24
              period: hour
            error_after: 
              count: 48
              period: hour
            
            
      - name: transactions
        description: "Raw payment processing ledger records"
        config:
          loaded_at_field: transaction_date
          freshness:
            warn_after:
              count: 24
              period: hour
            error_after:
              count: 48
              period: hour
        